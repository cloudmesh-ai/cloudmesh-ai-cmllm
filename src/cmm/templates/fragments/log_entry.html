<div class="flex gap-3 p-2 border-b border-slate-700/50 hover:bg-slate-700/30 transition-colors group">
    <span class="text-slate-500 font-mono text-xs shrink-0">[{{ timestamp }}]</span>
    <span class="px-1.5 py-0.5 bg-blue-500/20 text-blue-400 text-[10px] rounded font-bold uppercase shrink-0">
        {{ provider }}
    </span>
    <span class="text-slate-300 leading-relaxed">
        {{ message }}
        {% if scenario %}
        <span class="text-slate-500 italic text-xs ml-2">({{ scenario }})</span>
        {% endif %}
    </span>
    <span class="text-slate-600 text-[10px] opacity-0 group-hover:opacity-100 transition-opacity ml-auto">
        {{ request_id }}
    </span>
</div>
