[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudmesh-ai-cmm"
dynamic = ["version"]
description = "Containerized Model LLM Orchestrator for Cloudmesh AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "colorama>=0.4.6",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
]

[project.scripts]
cmm = "cmm.main:cli"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.package-data]
cmm = ["templates/**/*"]